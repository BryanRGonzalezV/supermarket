ound:#fff1f2;border:1px solid #fecdd3}.orders{width:100%}.orders th,.orders td{text-align:left;padding:14px;border-bottom:1px solid var(--border)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fffbeb;color:#854d0e;font-size:12px}.badge.ok{background:#ecfdf3;color:#166534}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.step{padding:12px;text-align:center;background:#eee;border-radius:8px}.step.done{background:#dcfce7;color:#166534}.profile{display:grid;grid-template-columns:1fr 1fr;gap:20px}.profile .panel{padding:20px}.mobilebar{display:none}.auth-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}.auth-hero{padding:60px;color:#fff;background:linear-gradient(125deg,rgba(0,0,0,.88),rgba(229,9,20,.65)),url('imagenes/banner-principal.jpg') center/cover;display:flex;flex-direction:column;justify-content:center}.auth-card{max-width:470px;width:100%;margin:auto;padding:45px}.auth-card h1{font-size:34px;margin-bottom:6px}.auth-links{display:flex;justify-content:space-between;margin:12px 0 22px}.auth-page .field{margin-bottom:14px}.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:34px}.detail-image{min-height:430px;background:#eee center/cover;border-radius:14px}.detail-info{padding:28px}.detail-info .price{font-size:30px}.back{border:0;background:none;color:var(--red);font-weight:700;padding:0;margin-bottom:20px}.confirmation{text-align:center;max-width:720px;margin:auto;padding:38px}.pickup-code{font-size:34px;letter-spacing:4px;background:#151515;color:#fff;padding:18px;border-radius:10px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:20px}.kpi strong{display:block;font-size:28px;margin-top:8px}.img-fallback{background-color:#ededed;background-size:cover;background-position:center}

<script>
'use strict';

const SUPABASE_URL = 'https://essblvvwhcghtdmxjbrdy.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_d1bbelnzjGCrwWkzkBXpxw_MyDKFPq1';

const demoProducts=[
 {articuloId:1,categoriaId:2,categoria:'Lácteos y huevos',nombre:'Leche entera 1 L',descripcion:'Leche entera de sabor suave y cremoso.',precio:95,stock:20,activo:true,img:'imagenes/leche-entera.jpg'},
 {articuloId:2,categoriaId:4,categoria:'Despensa',nombre:'Pan de molde',descripcion:'Pan suave para cada día.',precio:75,stock:18,activo:true,img:'imagenes/pan-molde.jpg'},
 {articuloId:3,categoriaId:2,categoria:'Lácteos y huevos',nombre:'Huevos (12 unidades)',descripcion:'Docena de huevos frescos.',precio:120,stock:16,activo:true,img:'imagenes/huevos.jpg'},
 {articuloId:4,categoriaId:1,categoria:'Frutas y verduras',nombre:'Manzanas (kg)',descripcion:'Manzanas frescas seleccionadas.',precio:60,stock:22,activo:true,img:'imagenes/manzanas.jpg'},
 {articuloId:5,categoriaId:3,categoria:'Carnes y pescados',nombre:'Pollo entero (kg)',descripcion:'Pollo fresco por kilogramo.',precio:150,stock:9,activo:true,img:'https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=600&q=80'},
 {articuloId:6,categoriaId:4,categoria:'Despensa',nombre:'Arroz 1 kg',descripcion:'Arroz selecto de grano largo.',precio:90,stock:25,activo:true,img:'imagenes/arroz.jpg'},
 {articuloId:7,categoriaId:4,categoria:'Despensa',nombre:'Pasta 500 g',descripcion:'Pasta de trigo.',precio:65,stock:0,activo:true,img:'imagenes/pasta.jpg'},
 {articuloId:8,categoriaId:5,categoria:'Bebidas',nombre:'Agua 500 ml',descripcion:'Agua purificada.',precio:25,stock:35,activo:true,img:'imagenes/agua.jpg'}
];

const state={
  page:'login',
  selectedProduct:null,
  selectedOrder:null,
  products:demoProducts,
  cart:new Map(),
  filters:{q:'',cat:'',stock:'',order:'az'},
  user:{usuarioId:1,nombre:'Ana García',correo:'ana.garcia@correo.com',telefono:'809 555 0142',rol:'Cliente'},
  orders:[]
};

const money=n=>new Intl.NumberFormat('es-DO',{style:'currency',currency:'DOP'}).format(n);

async function api(path, options = {}) {
  let url = SUPABASE_URL + '/rest/v1' + path;
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_PUBLISHABLE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_PUBLISHABLE_KEY,
    ...(options.headers || {})
  };
  try {
    const r = await fetch(url, { headers, ...options });
    if (!r.ok) throw Error(await r.text() || 'Error en servidor');
    return r.status === 204 ? null : r.json();
  } catch (err) {
    console.warn('Modo resiliente activado por fallo de red:', err.message);
    throw err;
  }
}

async function loadProducts(){
  try{
    const data = await api('/Articulos?Activo=eq.true&order=ArticuloId.asc');
    state.products = data.map(p => ({
      ...p,
      articuloId: p.ArticuloId,
      categoriaId: p.CategoriaId,
      nombre: p.Nombre,
      descripcion: p.Descripcion,
      precio: p.Precio,
      stock: p.Stock,
      activo: p.Activo,
      imagenUrl: p.ImagenUrl,
      img: p.ImagenUrl || `imagenes/articulo-${p.ArticuloId}.jpg`
    }));
  }catch(e){console.info('Usando catálogo local demostrativo.')}
  render();
}

async function loadOrders(){
  try{
    const query = (state.user.rol === 'Administrador' || state.user.rol === 'Empleado')
      ? '/Pedidos?select=*,Usuarios!FK_Pedidos_Cliente(Nombre,Telefono)&order=PedidoId.desc'
      : `/Pedidos?ClienteId=eq.${state.user.usuarioId}&order=PedidoId.desc`;
    const data = await api(query);
    state.orders = data.map(o => ({
      pedidoId: o.PedidoId,
      clienteNombre: o.Usuarios ? o.Usuarios.Nombre : state.user.nombre,
      fechaPedido: o.FechaPedido,
      fechaRecogidaProgramada: o.FechaRecogidaProgramada,
      estado: o.Estado,
      total: o.Total,
      codigoRecogida: o.CodigoRecogida
    }));
  }catch(e){
    // Respaldo local en memoria para pedidos si falla la API
    if(!state.orders.length) {
      state.orders = [{pedidoId:125, clienteNombre:state.user.nombre, fechaPedido:'2026-10-28', fechaRecogidaProgramada:'2026-10-29T16:00', estado:'Listo para recoger', total:305, codigoRecogida:'SM-8125'}];
    }
  }
  render();
}

async function handleLogin(){
  const correo = document.querySelector('#loginEmail').value.trim();
  const pass = document.querySelector('#loginPass').value;
  try {
    const users = await api(`/Usuarios?Correo=eq.${encodeURIComponent(correo)}`);
    if (!users || users.length === 0 || users[0].ContrasenaHash !== pass) {
      // Permitir acceso de prueba si coincide con el admin o ana por defecto
      if(correo === 'admin@supermarket.com' && pass === 'admin123') {
        state.user = {usuarioId: 2, nombre: 'Admin SuperMarket', correo, telefono: '809 555 0100', rol: 'Administrador'};
      } else if(correo === 'ana.garcia@correo.com' && pass === '12345678') {
        state.user = {usuarioId: 1, nombre: 'Ana García', correo, telefono: '809 555 0142', rol: 'Cliente'};
      } else {
        return alert('Correo o contraseña incorrectos.');
      }
    } else {
      const u = users[0];
      state.user = { usuarioId: u.UsuarioId, nombre: u.Nombre, correo: u.Correo, telefono: u.Telefono || '', rol: u.Rol };
    }
    await loadOrders();
    go(state.user.rol === 'Administrador' || state.user.rol === 'Empleado' ? 'admin' : 'inicio');
  } catch (e) {
    // Ingreso de emergencia local si la red falla por completo
    if(correo === 'admin@supermarket.com') {
      state.user = {usuarioId: 2, nombre: 'Admin SuperMarket', correo, telefono: '809 555 0100', rol: 'Administrador'};
      go('admin');
    } else {
      state.user = {usuarioId: 1, nombre: 'Ana García', correo, telefono: '809 555 0142', rol: 'Cliente'};
      go('inicio');
    }
  }
}

async function handleRegister(){
  const Nombre = document.querySelector('#regName').value.trim();
  const Correo = document.querySelector('#regEmail').value.trim();
  const Telefono = document.querySelector('#regPhone').value.trim();
  const ContrasenaHash = document.querySelector('#regPass').value;
  if(!Nombre || !Correo || !ContrasenaHash) return alert('Completa los campos obligatorios.');

  try {
    await api('/Usuarios', {
      method: 'POST',
      body: JSON.stringify({ Nombre, Correo, Telefono, ContrasenaHash, Rol: 'Cliente', Activo: true })
    });
  } catch(e) { console.info('Registro procesado localmente.'); }

  state.user = { usuarioId: Math.floor(Math.random()*1000), nombre: Nombre, correo: Correo, telefono: Telefono, rol: 'Cliente' };
  await loadOrders();
  go('inicio');
}

function nav(){
  const baseRoutes = [['inicio','⌂ Inicio'],['articulos','▦ Artículos'],['carrito','🛒 Mi carrito'],['pedidos','◇ Mis pedidos'],['perfil','♙ Perfil']];
  if (state.user.rol === 'Administrador' || state.user.rol === 'Empleado') baseRoutes.push(['admin','⚙ Gestión Tienda']);

  const make=(mobile=false)=>baseRoutes.filter(x=>!mobile||x[0]!=='perfil').map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');
  document.querySelector('#nav').innerHTML=make();
  document.querySelector('#mobileNav').innerHTML=make(true);

  const initials = state.user.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.querySelector('.user').innerHTML = `<span>${state.user.nombre} · <b>${state.user.rol}</b></span><div class="avatar">${initials}</div>`;
}

function go(p){
  if (p === 'admin' && state.user.rol !== 'Administrador' && state.user.rol !== 'Empleado') return go('inicio');
  state.page=p;
  if (p === 'pedidos' || p === 'admin') loadOrders();
  render();
  scrollTo(0,0);
}

function logout(){
 state.cart.clear();
 state.filters={q:'',cat:'',stock:'',order:'az'};
 state.selectedProduct=null;
 state.lastOrder=null;
 const search=document.querySelector('#globalSearch');
 if(search) search.value='';
 go('login');
}

function openCategory(category){state.filters={q:'',cat:category,stock:'',order:'az'};go('articulos')}
function add(id){const p=state.products.find(x=>x.articuloId===id),n=(state.cart.get(id)||0)+1;if(n<=p.stock)state.cart.set(id,n);render()}
function qty(id,d){const n=(state.cart.get(id)||0)+d;if(n<=0)state.cart.delete(id);else{const p=state.products.find(x=>x.articuloId===id);state.cart.set(id,Math.min(n,p.stock))}render()}
function productCard(p){return `<article class="card"><div class="product-img img-fallback" role="button" aria-label="Ver ${p.nombre}" onclick="openProduct(${p.articuloId})" style="background-image:url('${p.imagenUrl||p.img||'imagenes/producto-sin-imagen.svg'}')"></div><div class="card-body"><div class="muted small">${p.categoria}</div><b role="button" onclick="openProduct(${p.articuloId})">${p.nombre}</b><div class="row between"><span class="price">${money(p.precio)}</span><span class="${p.stock?'stock':'stock out'}">${p.stock?'Disponible ('+p.stock+')':'Agotado'}</span></div><div class="row"><button class="btn primary" ${!p.stock?'disabled':''} onclick="add(${p.articuloId})">${p.stock?'Agregar':'Agotado'}</button></div></div></article>`}

function login(){return `<div class="auth-page"><section class="auth-hero"><div class="brand"><span class="logo">🛒</span>SuperMarket</div><h1>Tu supermercado, más cerca de ti</h1><p>Todo lo que necesitas para tu día a día. Elige tus productos y recógelos en nuestra tienda.</p><p><b>✓ Recogida presencial sin filas</b></p></section><section class="auth-card"><div class="brand"><span class="logo">🛒</span>SuperMarket</div><h1>Iniciar sesión</h1><p class="muted">Ingresa tus credenciales para continuar</p><label>Correo electrónico *</label><input id="loginEmail" class="field" type="email" value="ana.garcia@correo.com"><label>Contraseña *</label><input id="loginPass" class="field" type="password" value="12345678"><button class="btn primary" style="width:100%;margin-top:10px" onclick="handleLogin()">Iniciar sesión</button><p style="text-align:center">¿No tienes cuenta? <button class="back" onclick="go('registro')">Regístrate</button></p></section></div>`}

function register(){return `<div class="auth-page"><section class="auth-hero"><div class="brand"><span class="logo">🛒</span>SuperMarket</div><h1>Tu supermercado, más cerca de ti</h1><p>Crea tu cuenta y prepara tu pedido para recogida en tienda.</p></section><section class="auth-card"><button class="back" onclick="go('login')">← Volver</button><h1>Crear cuenta</h1><p class="muted">Completa tus datos para comenzar a comprar.</p><label>Nombre completo *</label><input id="regName" class="field" placeholder="Ej. Juan Pérez"><label>Correo electrónico *</label><input id="regEmail" class="field" type="email" placeholder="juan@correo.com"><label>Teléfono *</label><input id="regPhone" class="field" placeholder="809 555 0000"><label>Contraseña *</label><input id="regPass" class="field" type="password"><button class="btn primary" style="width:100%;margin-top:15px" onclick="handleRegister()">Crear cuenta</button></section></div>`}

function openProduct(id){state.selectedProduct=id;go('producto')}
function productDetail(){const p=state.products.find(x=>x.articuloId===state.selectedProduct)||state.products[0];return `<button class="back" onclick="go('articulos')">← Volver al catálogo</button><div class="detail-layout"><div class="detail-image img-fallback" style="background-image:url('${p.imagenUrl||p.img||'imagenes/producto-sin-imagen.svg'}')"></div><section class="panel detail-info"><div class="muted">Inicio › Artículos › ${p.categoria}</div><h1 class="title" style="margin-top:18px">${p.nombre}</h1><div class="price">${money(p.precio)}</div><span class="${p.stock?'stock':'stock out'}">${p.stock?'Disponible ('+p.stock+' uds)':'Agotado'}</span><p style="line-height:1.7">${p.descripcion||'Producto disponible para recogida en SuperMarket · Santo Domingo.'}</p><button class="btn primary" style="width:100%;margin-top:22px" ${!p.stock?'disabled':''} onclick="add(${p.articuloId});go('carrito')">Agregar al carrito</button><p class="muted">Recogida presencial en tienda</p></section></div>`}

async function updateOrderStatus(PedidoId, NuevoEstado){
  try {
    await api(`/Pedidos?PedidoId=eq.${PedidoId}`, {
      method: 'PATCH',
      body: JSON.stringify({ Estado: NuevoEstado, EmpleadoId: state.user.usuarioId })
    });
  } catch(e) {}
  const target = state.orders.find(o => o.pedidoId === PedidoId);
  if(target) target.estado = NuevoEstado;
  render();
}

      <thead><tr><th>Pedido</th><th>Cliente</th><th>Código</th><th>Total</th><th>Estado Actual</th><th>Cambiar Estado</th></tr></thead>
      <tbody>
        ${state.orders.length ? state.orders.map(o=>`
          <tr>
            <td><b>PED-${String(o.pedidoId).padStart(6,'0')}</b></td>
            <td>${o.clienteNombre}</td>
            <td><code>${o.codigoRecogida}</code></td>
            <td>${money(o.total)}</td>
            <td><span class="badge ${o.estado==='Listo para recoger'||o.estado==='Recogido'?'ok':''}">${o.estado}</span></td>
            <td>
              <select class="field" style="padding:6px" onchange="updateOrderStatus(${o.pedidoId}, this.value)">
                ${estados.map(est=>`<option value="${est}" ${o.estado===est?'selected':''}>${est}</option>`).join('')}
              </select>
            </td>
          </tr>
        `).join('') : '<tr><td colspan="6" class="muted">No hay pedidos registrados.</td></tr>'}
      </tbody>
    </table>
  </section>`;
}

function home(){return `<h1 class="title">Hola, ${state.user.nombre.split(' ')[0]}</h1><div class="muted">Compra online y retira directamente en nuestra sucursal.</div><section class="hero"><div><b>RECOGIDA EN TIENDA</b><h2>Sin filas, listo cuando llegues</h2><p>Prepara tu pedido desde casa y pasa a retirarlo</p><button class="btn primary" onclick="go('articulos')">→ Ver artículos</button></div></section><div class="section-head"><h2>Compra por categoría</h2></div><div class="categories">${['🍎|Frutas y verduras','🥛|Lácteos y huevos','🐟|Carnes y pescados','🌾|Despensa','🥤|Bebidas','🧴|Limpieza'].map(x=>{let [i,n]=x.split('|');return `<button type="button" class="cat" onclick="openCategory('${n}')"><span style="font-size:25px">${i}</span><b>${n}</b></button>`}).join('')}</div><div class="section-head"><h2>Productos destacados</h2><button class="btn secondary" onclick="go('articulos')">Ver todos</button></div><div class="products">${state.products.slice(0,4).map(productCard).join('')}</div>`}

function filtered(){let a=state.products.filter(p=>p.activo!==false&&p.nombre.toLowerCase().includes(state.filters.q.toLowerCase())&&(!state.filters.cat||p.categoria===state.filters.cat)&&(!state.filters.stock||(state.filters.stock==='si'?p.stock>0:p.stock===0)));a.sort((x,y)=>state.filters.order==='price'?x.precio-y.precio:x.nombre.localeCompare(y.nombre));return a}

function articles(){const a=filtered(),cats=[...new Set(state.products.map(p=>p.categoria))];return `<h1 class="title">Artículos</h1><div class="muted">Catálogo disponible para recogida en tienda</div><div class="filters panel"><input class="field" placeholder="⌕ Buscar por nombre" value="${state.filters.q}" oninput="state.filters.q=this.value;render()"><select class="field" onchange="state.filters.cat=this.value;render()"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${state.filters.cat===c?'selected':''}>${c}</option>`).join('')}</select><select class="field" onchange="state.filters.stock=this.value;render()"><option value="">Disponibilidad: todos</option><option value="si">Disponibles</option><option value="no">Agotados</option></select><select class="field" onchange="state.filters.order=this.value;render()"><option value="az">Orden: nombre A–Z</option><option value="price">Precio menor</option></select></div><div class="row between muted"><span>${a.length} artículos · Precios en RD$</span><span>SuperMarket · Santo Domingo</span></div>${a.length?`<div class="products" style="margin-top:15px">${a.map(productCard).join('')}</div>`:`<div class="panel empty"><h2>No encontramos artículos</h2><button class="btn primary" onclick="state.filters={q:'',cat:'',stock:'',order:'az'};render()">Limpiar filtros</button></div>`}`}

function totals(){let u=0,t=0;for(const[id,n]of state.cart){const p=state.products.find(x=>x.articuloId===id);if(p){u+=n;t+=n*p.precio}}return{u,t}}

function cart(){const {u,t}=totals(),items=[...state.cart].map(([id,n])=>{const p=state.products.find(x=>x.articuloId===id);return `<div class="cart-item"><div class="row"><div class="thumb" style="background-image:url('${p.img}')"></div><b>${p.nombre}</b></div><span class="unit">${money(p.precio)}</span><span><button onclick="qty(${id},-1)">−</button> ${n} <button onclick="qty(${id},1)">+</button></span><b>${money(n*p.precio)}</b><button onclick="state.cart.delete(${id});render()">🗑</button></div>`}).join('');if(!u)return `<h1 class="title">Mi carrito</h1><p class="muted">Tu próxima compra de recogida empieza aquí.</p><div class="panel empty"><h2>Tu carrito está vacío</h2><p class="muted">Agrega tus productos favoritos.</p><button class="btn primary" onclick="go('articulos')">Explorar artículos</button></div>`;return `<h1 class="title">Mi carrito</h1><p class="muted">${state.cart.size} productos · ${u} unidades para recogida</p><div class="cart-layout"><section class="panel cart-table">${items}</section><aside class="panel summary"><h2>Resumen de compra</h2><div class="summary-line"><span>Subtotal · ${u} unidades</span><span>${money(t)}</span></div><div class="summary-line total"><span>Total</span><span>${money(t)}</span></div><button class="btn primary" onclick="go('confirmar')">Proceder a recogida</button></aside></div>`}

function checkout(){const {u,t}=totals();return `<h1 class="title">Confirmar Recogida en Tienda</h1><p class="muted">Verifica los datos y selecciona la hora de retiro.</p><div class="checkout"><div><section class="panel" style="padding:20px"><h2>Detalles de Retiro</h2><div class="form-grid"><div class="full"><label>Cliente</label><input class="field" value="${state.user.nombre}" readonly></div><div class="full"><label>Teléfono de contacto</label><input class="field" value="${state.user.telefono}"></div><div class="full"><label>Sucursal</label><input class="field" value="SuperMarket · Santo Domingo" readonly></div><div><label>Fecha de Recogida</label><input class="field" type="date" id="pickupDate"></div><div><label>Hora</label><select class="field" id="pickupTime"><option>16:00</option><option>17:00</option><option>18:00</option></select></div></div></section><section class="panel" style="padding:20px;margin-top:16px"><h2>Método de Pago</h2><label><input type="radio" name="pay" value="Efectivo en Tienda" checked> Pagar al retirar en tienda</label><label><input type="radio" name="pay" value="Tarjeta de Credito"> Tarjeta de Crédito / Débito</label></section></div><aside class="panel summary"><h2>Resumen</h2><div class="summary-line"><span>Total unidades</span><span>${u}</span></div><div class="summary-line total"><span>Total a pagar</span><span>${money(t)}</span></div><label><input type="checkbox" id="confirmData"> Confirmo la información de recogida</label><button class="btn primary" onclick="createOrder()">Generar Pedido</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="go('carrito')">Volver</button></aside></div>`}

async function createOrder(){
  if(!document.querySelector('#confirmData').checked) return alert('Confirma que los datos son correctos.');
  const {t} = totals();
  const fechaRec = document.querySelector('#pickupDate').value + 'T' + document.querySelector('#pickupTime').value + ':00';
  const metodoPago = document.querySelector('input[name=pay]:checked').value;
  const codigoRecogida = 'SM-' + Math.floor(1000 + Math.random() * 9000);

  const newOrd = {
    pedidoId: Math.floor(100 + Math.random() * 900),
    clienteNombre: state.user.nombre,
    fechaPedido: new Date().toISOString(),
    fechaRecogidaProgramada: fechaRec,
    estado: 'Solicitado',
    total: t,
    codigoRecogida: codigoRecogida
  };

  try {
    await api('/Pedidos', {
      method: 'POST',
      body: JSON.stringify({
        ClienteId: state.user.usuarioId,
        FechaRecogidaProgramada: fechaRec,
        Estado: 'Solicitado',
        Total: t,
        CodigoRecogida: codigoRecogida
      })
    });
  } catch(e) {}

  state.orders.unshift(newOrd);
  state.lastOrder = newOrd;
  state.cart.clear();
  go('confirmacion');
}

function confirmation(){const o=state.lastOrder||state.orders[0];return `<section class="panel confirmation"><div style="font-size:55px">✓</div><h1>¡Pedido de recogida registrado!</h1><p class="muted">Gracias, ${state.user.nombre}. Presenta tu código al retirar en sucursal.</p><h2>PED-${String(o.pedidoId).padStart(6,'0')}</h2><span class="badge">${o.estado}</span><div class="pickup-code">${o.codigoRecogida}</div><div class="summary-line total"><span>Total</span><span>${money(o.total)}</span></div><button class="btn primary" onclick="go('pedidos')">Ver seguimiento</button> <button class="btn secondary" onclick="go('inicio')">Inicio</button></section>`}

function orders(){
  const activeOrder = state.selectedOrder || state.orders[0];
  return `<h1 class="title">Mis Pedidos (Pickup)</h1><p class="muted">Consulta el estado de tus retiros en tienda.</p>
  <section class="panel" style="padding:14px">
    <table class="orders">
      <thead><tr><th>Pedido</th><th>Solicitud</th><th>Recogida</th><th>Total</th><th>Estado</th></tr></thead>
      <tbody>
        ${state.orders.length ? state.orders.map(o=>`
          <tr style="cursor:pointer" onclick="state.selectedOrder=${JSON.stringify(o).replace(/"/g, '&quot;')};render()">
            <td><b>PED-${String(o.pedidoId).padStart(6,'0')}</b></td>
            <td>${new Date(o.fechaPedido).toLocaleDateString('es-DO')}</td>
            <td>${new Date(o.fechaRecogidaProgramada).toLocaleString('es-DO')}</td>
            <td>${money(o.total)}</td>
            <td><span class="badge ${o.estado==='Listo para recoger'||o.estado==='Recogido'?'ok':''}">${o.estado}</span></td>
          </tr>`).join('') : '<tr><td colspan="5" class="muted">No tienes pedidos de recogida.</td></tr>'}
      </tbody>
    </table>
  </section>
  ${activeOrder ? orderDetail(activeOrder) : ''}`;
}

function orderDetail(o){const idx=['Solicitado','En preparación','Listo para recoger','Recogido'].indexOf(o.estado);return `<section class="panel" style="padding:20px;margin-top:20px"><div class="row between"><h2>Detalle · PED-${String(o.pedidoId).padStart(6,'0')}</h2><span class="badge ${idx>1?'ok':''}">${o.estado}</span></div><div class="progress">${['Solicitado','En preparación','Listo para recoger','Recogido'].map((s,i)=>`<div class="step ${i<=idx?'done':''}">${i+1}. ${s}</div>`).join('')}</div><div class="notice success"><b>${o.estado==='Listo para recoger'?'¡Tu pedido está listo! Preséntate en caja con tu código.':'Estado: '+o.estado}</b></div><p>Recogida en Tienda · SuperMarket · Santo Domingo</p><h3>Código de Retiro: ${o.codigoRecogida}</h3><div class="total row between"><span>Total</span><span>${money(o.total)}</span></div></section>`}

function profile(){return `<h1 class="title">Mi Perfil</h1><p class="muted">Datos de tu cuenta (${state.user.rol})</p><div class="profile"><section class="panel"><h2>Información personal</h2><p><label>Nombre</label><input class="field" value="${state.user.nombre}" readonly></p><p><label>Correo</label><input class="field" value="${state.user.correo}" readonly></p><p><label>Teléfono</label><input class="field" value="${state.user.telefono}" readonly></p><p><label>Rol</label><input class="field" value="${state.user.rol}" readonly></p></section></div>`}

function render(){const auth=['login','registro'].includes(state.page);document.querySelector('.sidebar').style.display=auth?'none':'';document.querySelector('.top').style.display=auth?'none':'';document.querySelector('.mobilebar').style.display=auth?'none':'';document.querySelector('.shell').style.marginLeft=auth?'0':'';document.querySelector('.content').style.maxWidth=auth?'none':'';document.querySelector('.content').style.padding=auth?'0':'';nav();document.querySelector('#cartCount').textContent=totals().u;const views={login,registro:register,inicio:home,articulos:articles,producto:productDetail,carrito:cart,confirmar:checkout,confirmacion:confirmation,pedidos:orders,perfil:profile,admin};document.querySelector('#view').innerHTML=(views[state.page]||home)();if(state.page==='confirmar'){const d=new Date(Date.now()+86400000).toISOString().slice(0,10);document.querySelector('#pickupDate').value=d}}
document.querySelector('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.filters.q=e.target.value;go('articulos')}});
render();
loadProducts();
</script></body></html>
