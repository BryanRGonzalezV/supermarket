<script>
'use strict';
const SUPABASE_URL='https://essbivwhcghtdmxjbrdy.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_d1bbelnzjGCrwWkzkBXpxw_MyDKFPq1';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-DO',{style:'currency',currency:'DOP'}).format(Number(n)||0);
const dateFmt=v=>v?new Date(v).toLocaleString('es-DO',{timeZone:'America/Santo_Domingo'}):'—';
const state={page:'login',user:null,products:[],categories:[],cart:new Map(),orders:[],notifications:[],cards:[],filters:{q:'',cat:'',stock:'',order:'az'},selectedProduct:null,selectedOrder:null,lastOrder:null,lastReceipt:null,favorites:new Set(),ready:false,channel:null,requestId:null};

const statuses=['Solicitado','En preparación','Listo para recoger','Recogido'];
function toast(message,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=message;$('#toastWrap').append(el);setTimeout(()=>el.remove(),5500)}
function net(ok,msg){$('#netStatus').className='net-status '+(ok?'ok':'bad');$('#netStatus').textContent='● '+msg}
async function result(p){const {data,error}=await p;if(error)throw Error(error.message);return data}
const rpc=(name,args={})=>result(db.rpc(name,args));
async function busy(form,fn){const b=form.querySelector('button[type=submit]');if(b?.disabled)return;if(b)b.disabled=true;try{await fn()}catch(e){toast(e.message,'error')}finally{if(b)b.disabled=false}}
const phone=v=>String(v??'').replace(/[^0-9]/g,'').slice(0,10);
function phoneField(id,value='',required=true){return `<input class="field" id="${id}" name="telefono" type="tel" inputmode="numeric" maxlength="10" minlength="10" pattern="[0-9]{10}" placeholder="8095550000" value="${esc(phone(value))}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" ${required?'required':''}>`}
function login(){return `<div class="auth-page"><section class="auth-hero"><div class="brand"><span class="logo">🛒</span>SuperMarkNet</div><h1>Tu supermercado, más cerca de ti</h1><p>Todo lo que necesitas para tu día a día. Elige tus productos y recógelos en nuestra tienda.</p><p><b>✓ Calidad siempre · ✓ Recogida sin filas</b></p></section><section class="auth-card"><div class="brand"><span class="logo">🛒</span>SuperMarkNet</div><h1>Iniciar sesión</h1><p class="muted">Ingresa tus credenciales verificadas.</p><form onsubmit="handleLogin(event)"><label for="loginEmail">Correo electrónico *</label><input id="loginEmail" class="field" type="email" placeholder="ana.garcia@correo.com" maxlength="254" autocomplete="username" required><label for="loginPass">Contraseña *</label><input id="loginPass" class="field" type="password" placeholder="••••••••" minlength="8" maxlength="72" autocomplete="current-password" required><button class="btn primary" type="submit">Iniciar sesión</button></form><div class="auth-example"><b>Ejemplo visual (no editable)</b><div>Correo: ana.garcia@correo.com</div><div>Contraseña: ••••••••</div><div>Los datos son ilustrativos, no una cuenta de acceso.</div></div><p style="text-align:center">¿No tienes cuenta? <button class="back" onclick="go('registro')">Regístrate</button></p><p style="text-align:center"><button class="back" onclick="go('recuperar')">Recuperar contraseña</button></p></section></div>`}
function register(){return `<div class="auth-page"><section class="auth-hero"><div class="brand"><span class="logo">🛒</span>SuperMarkNet</div><h1>Compra fácil, recoge rápido</h1><p>Crea tu cuenta y confirma tu correo electrónico.</p></section><section class="auth-card"><button class="back" onclick="go('login')">← Volver</button><h1>Crear cuenta</h1><form onsubmit="handleRegister(event)"><label for="regName">Nombre completo *</label><input id="regName" class="field" placeholder="Juan Pérez" minlength="2" maxlength="80" autocomplete="name" required><label for="regEmail">Correo electrónico *</label><input id="regEmail" class="field" type="email" maxlength="254" placeholder="juan@correo.com" autocomplete="email" required><label for="regPhone">Teléfono (10 dígitos) *</label>${phoneField('regPhone')}<label for="regPass">Contraseña (8–72 caracteres) *</label><input id="regPass" class="field" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><label for="regConfirm">Confirmar contraseña *</label><input id="regConfirm" class="field" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><button type="submit" class="btn primary">Crear cuenta</button></form></section></div>`}
function recovery(){return `<div class="auth-page"><section class="auth-hero"><h1>SuperMarkNet</h1><p>Protege tu cuenta.</p></section><section class="auth-card"><button class="back" onclick="go('login')">← Volver</button><h1>Recuperar contraseña</h1><form onsubmit="recover(event)"><label for="recoverEmail">Correo electrónico</label><input id="recoverEmail" class="field" type="email" maxlength="254" required><button type="submit" class="btn primary">Enviar enlace</button></form></section></div>`}
function resetView(){return `<div class="auth-page"><section class="auth-hero"><h1>SuperMarkNet</h1></section><section class="auth-card"><h1>Nueva contraseña</h1><form onsubmit="resetPassword(event)"><input id="resetPass" class="field" type="password" minlength="8" maxlength="72" required placeholder="Nueva contraseña"><button class="btn primary" type="submit">Guardar contraseña</button></form></section></div>`}
const siteUrl=()=>location.origin+location.pathname;
async function handleLogin(e){e.preventDefault();await busy(e.target,async()=>{await result(db.auth.signInWithPassword({email:$('#loginEmail').value.trim().toLowerCase(),password:$('#loginPass').value}));await startSession()})}
async function handleRegister(e){e.preventDefault();await busy(e.target,async()=>{const nombre=$('#regName').value.trim(),password=$('#regPass').value;if(nombre.length<2)throw Error('Escribe tu nombre completo.');if(password!==$('#regConfirm').value)throw Error('Las contraseñas no coinciden.');const data=await result(db.auth.signUp({email:$('#regEmail').value.trim().toLowerCase(),password,options:{emailRedirectTo:siteUrl(),data:{nombre,telefono:$('#regPhone').value}}}));if(data.session){await db.auth.signOut();throw Error('Activa Confirm email en Supabase antes de registrar usuarios.')}go('login');toast('Si el correo es válido, recibirás un enlace de confirmación. Revisa tu bandeja.','success')})}
async function recover(e){e.preventDefault();await busy(e.target,async()=>{await result(db.auth.resetPasswordForEmail($('#recoverEmail').value.trim(),{redirectTo:siteUrl()}));toast('Revisa tu correo para recuperar el acceso.','success')})}
async function resetPassword(e){e.preventDefault();await busy(e.target,async()=>{await result(db.auth.updateUser({password:$('#resetPass').value}));await startSession();toast('Contraseña actualizada.','success')})}
function storageKey(){return 'supermarknet_cart_'+state.user?.usuarioId}
function saveCart(){if(state.user)localStorage.setItem(storageKey(),JSON.stringify([...state.cart]));}
function restoreCart(){try{state.cart=new Map(JSON.parse(localStorage.getItem(storageKey())||'[]').filter(x=>Array.isArray(x)&&Number.isInteger(x[0])&&Number.isInteger(x[1])&&x[1]>0&&x[1]<=99))}catch{state.cart=new Map()}}
let sessionStarting=false, poll=null, syncTimer=null, syncBusy=false, sessionVersion=0;
async function startSession(){if(sessionStarting)return;sessionStarting=true;try{state.user=await rpc('sm_perfil');sessionVersion++;state.orders=[];state.notifications=[];state.cards=[];restoreCart();try{state.favorites=new Set(JSON.parse(localStorage.getItem('supermarknet_favorites_'+state.user.usuarioId)||'[]'))}catch{state.favorites=new Set()}state.requestId=localStorage.getItem('supermarknet_request_'+state.user.usuarioId)||null;await refreshData(true);go(staff()?'admin':'inicio');subscribe();if(new URLSearchParams(location.search).has('pago')){history.replaceState({},'',location.pathname);go('pedidos');toast('Verificando el resultado del pago con el proveedor.')}}catch(e){await db.auth.signOut();state.user=null;go('login');throw e}finally{sessionStarting=false}}
async function logout(){sessionVersion++;clearInterval(poll);clearTimeout(syncTimer);if(state.channel)await db.removeChannel(state.channel);state.channel=null;await db.auth.signOut();state.user=null;state.cart.clear();state.orders=[];state.notifications=[];state.cards=[];state.selectedOrder=null;state.lastOrder=null;state.requestId=null;state.filters={q:'',cat:'',stock:'',order:'az'};$('#globalSearch').value='';go('login')}
async function fetchCatalog(){let [cats,items]=await Promise.all([result(db.from('Categorias').select('CategoriaId,Nombre,Activo').order('Nombre')),result(db.from('Articulos').select('ArticuloId,CategoriaId,Nombre,Descripcion,Precio,Stock,StockCapacidad,Activo,ImagenUrl').order('Nombre'))]);return {categories:cats,products:items.map(p=>({articuloId:p.ArticuloId,categoriaId:p.CategoriaId,categoria:cats.find(c=>c.CategoriaId===p.CategoriaId)?.Nombre||'Sin categoría',categoriaActiva:cats.find(c=>c.CategoriaId===p.CategoriaId)?.Activo===true,nombre:p.Nombre,descripcion:p.Descripcion,precio:Number(p.Precio),stock:p.Stock,capacidad:p.StockCapacidad,activo:p.Activo,img:p.ImagenUrl}))}}
async function fetchOrders(){let query=db.from('Pedidos').select('PedidoId,ClienteId,FechaPedido,FechaRecogidaProgramada,Estado,Total,CodigoRecogida,Usuarios!FK_Pedidos_Cliente(Nombre),Pagos(PagoId,MetodoPago,Estado,Monto)').order('PedidoId',{ascending:false});if(!staff())query=query.eq('ClienteId',state.user.usuarioId);const data=await result(query);return data.map(o=>({pedidoId:o.PedidoId,clienteId:o.ClienteId,clienteNombre:o.Usuarios?.Nombre||state.user.nombre,fechaPedido:o.FechaPedido,fechaRecogidaProgramada:o.FechaRecogidaProgramada,estado:o.Estado,total:Number(o.Total),codigoRecogida:o.CodigoRecogida,pago:(o.Pagos||[]).sort((a,b)=>b.PagoId-a.PagoId)[0]}))}
async function refreshData(initial=false){if(!state.user||syncBusy)return;const version=sessionVersion;syncBusy=true;try{const [catalog,orders,notifications,cards]=await Promise.all([fetchCatalog(),fetchOrders(),result(db.from('Notificaciones').select('*').order('NotificacionId',{ascending:false}).limit(100)),result(db.from('TarjetasGuardadas').select('TarjetaId,Marca,Ultimos4,MesVencimiento,AnoVencimiento,Tipo').order('TarjetaId',{ascending:false}))]);if(version!==sessionVersion)return;const oldIds=new Set(state.notifications.map(n=>n.NotificacionId));const changed=JSON.stringify([state.products,state.categories,state.orders,state.notifications,state.cards])!==JSON.stringify([catalog.products,catalog.categories,orders,notifications,cards]);Object.assign(state,catalog,{orders,notifications,cards});if(!initial)notifications.filter(n=>!oldIds.has(n.NotificacionId)&&!n.Leida).reverse().forEach(n=>toast(n.Mensaje,'success'));net(true,'Supabase conectado');updateHeader();if(changed&&state.page==='articulos'&&document.activeElement?.matches('#view input,#view select'))updateProducts();else if(changed&&['inicio','articulos','producto','carrito','pedidos','admin','notificaciones','confirmacion'].includes(state.page)&&!(state.page==='admin'&&document.activeElement?.matches('#view input,#view select')))render()}catch(e){net(false,'Error de conexión');if(initial)throw e;console.warn(e.message)}finally{syncBusy=false}}
function subscribe(){if(state.channel)db.removeChannel(state.channel);clearInterval(poll);let ch=db.channel('supermarknet-'+state.user.usuarioId);for(const table of ['Pedidos','Articulos','Categorias','Notificaciones','Pagos'])ch=ch.on('postgres_changes',{event:'*',schema:'public',table},()=>{clearTimeout(syncTimer);syncTimer=setTimeout(()=>refreshData(),200)});state.channel=ch.subscribe();poll=setInterval(()=>refreshData(),8000)}
function nav(){if(!state.user)return;let routes=[['inicio','⌂ Inicio'],['articulos','▦ Artículos'],['carrito','🛒 Mi carrito'],['pedidos','◇ Mis pedidos'],['perfil','♙ Perfil'],['notificaciones','🔔 Avisos']];if(staff())routes.push(['admin','⚙ Gestión Tienda']);const make=mobile=>routes.filter(x=>!mobile||['inicio','articulos','carrito','pedidos',staff()?'admin':'perfil'].includes(x[0])).map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');$('#nav').innerHTML=make(false);$('#mobileNav').innerHTML=make(true);const initial=state.user.nombre.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();$('#topUser').innerHTML=`<span>${esc(state.user.nombre)} · <b>${esc(state.user.rol)}</b></span><div class="avatar">${esc(initial)}</div>`}
function updateHeader(){$('#cartCount').textContent=totals().u;$('#notificationCount').textContent=state.notifications.filter(n=>!n.Leida).length}
function go(p){if(!state.user&&!['login','registro','recuperar','reset'].includes(p))p='login';if(p==='admin'&&!staff())p='inicio';state.page=p;render();scrollTo(0,0);if(['pedidos','admin','notificaciones','perfil','articulos','carrito'].includes(p)&&state.user)refreshData()}
function render(){const auth=['login','registro','recuperar','reset'].includes(state.page);$('.sidebar').style.display=auth?'none':'';$('.top').style.display=auth?'none':'';$('.mobilebar').style.display=auth?'none':'';$('.shell').style.marginLeft=auth?'0':'';$('.content').style.maxWidth=auth?'none':'';$('.content').style.padding=auth?'0':'';nav();updateHeader();const views={login,registro:register,recuperar:recovery,reset:resetView,inicio:home,articulos:articles,producto:productDetail,carrito:cart,confirmar:checkout,confirmacion:confirmation,pedidos:orders,perfil:profile,admin,notificaciones:notifications};$('#view').innerHTML=(views[state.page]||login)()}
function getProduct(id){return state.products.find(x=>x.articuloId===id)}
function stockLevel(p){const r=p.stock/Math.max(1,p.capacidad);return p.stock<=0?0:r>=.66?3:r>=1/3?2:1}
function availability(p){const l=stockLevel(p),label=['Agotado','Disponibilidad baja','Disponibilidad media','Disponibilidad alta'][l],cl=['none','low','medium','high'][l];return `<span class="stock-meter stock-${cl}" aria-label="${label}"><span>${label}</span><span class="stock-track" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=l?'on':''}"></i>`).join('')}</span></span>`}
function legend(){return '<div class="legend"><span class="stock-high">● Alta (66–100%)</span><span class="stock-medium">● Media (⅓–menos de 66%)</span><span class="stock-low">● Baja (menos de ⅓)</span><span class="stock-none">● Agotado</span></div>'}
function productImage(p,cls){let url='';try{if(p.img){const u=new URL(p.img,location.href);if(['http:','https:'].includes(u.protocol))url=u.href}}catch{}return `<div class="${cls}"><span>${icons[p.categoria]||'🛍️'}</span>${url?`<img alt="${esc(p.nombre)}" src="${esc(url)}" style="display:none" onload="this.previousElementSibling.style.display='none';this.style.display='block'" onerror="this.remove()">`:''}</div>`}
function publicProducts(){return state.products.filter(p=>p.activo&&p.categoriaActiva)}
function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem('supermarknet_favorites_'+state.user.usuarioId,JSON.stringify([...state.favorites]));render()}
function productCard(p){return `<article class="card"><button class="favorite ${state.favorites.has(p.articuloId)?'on':''}" onclick="toggleFavorite(${p.articuloId})" aria-label="Favorito" aria-pressed="${state.favorites.has(p.articuloId)}">${state.favorites.has(p.articuloId)?'♥':'♡'}</button><div role="button" tabindex="0" onclick="openProduct(${p.articuloId})" onkeydown="if(event.key==='Enter')openProduct(${p.articuloId})">${productImage(p,'product-img')}</div><div class="card-body"><div class="muted small">${esc(p.categoria)}</div><b>${esc(p.nombre)}</b><div class="row between"><span class="price">${money(p.precio)}</span>${availability(p)}</div><button class="btn primary" style="width:100%" ${p.stock?'':'disabled'} onclick="add(${p.articuloId})">${p.stock?'Agregar':'Agotado'}</button></div></article>`}
function openProduct(id){state.selectedProduct=id;go('producto')}
function openCategory(id){state.filters={q:'',cat:String(id),stock:'',order:'az'};go('articulos')}
function home(){return `<h1 class="title">Hola, ${esc(state.user.nombre.split(' ')[0])}</h1><div class="muted">Compra online y retira en nuestra sucursal.</div><section class="hero"><div><b>RECOGIDA EN TIENDA</b><h2>Sin filas, listo cuando llegues</h2><p>Prepara tu pedido desde casa.</p><button class="btn primary" onclick="go('articulos')">→ Ver artículos</button></div></section><div class="section-head"><h2>Compra por categoría</h2></div><div class="categories">${state.categories.filter(c=>c.Activo).map(c=>`<button class="cat" onclick="openCategory(${c.CategoriaId})"><span style="font-size:25px">${icons[c.Nombre]||'🛍️'}</span><b>${esc(c.Nombre)}</b></button>`).join('')||'<p>No hay categorías activas.</p>'}</div><div class="section-head"><h2>Productos destacados</h2><button class="btn secondary" onclick="go('articulos')">Ver todos</button></div>${legend()}<div class="products">${publicProducts().slice(0,8).map(productCard).join('')}</div>`}
function filtered(){const f=state.filters;return publicProducts().filter(p=>p.nombre.toLocaleLowerCase().includes(f.q.toLocaleLowerCase())&&(!f.cat||String(p.categoriaId)===f.cat)&&(!f.stock||String(stockLevel(p))===f.stock)).sort((a,b)=>f.order==='price'?a.precio-b.precio:a.nombre.localeCompare(b.nombre,'es'))}
function updateProducts(){const a=filtered();$('#articleResults').innerHTML=`<p class="muted">${a.length} artículos · Precios en RD$</p><div class="products">${a.map(productCard).join('')||'<p>No encontramos artículos.</p>'}</div>`}
function articles(){const f=state.filters,sel=(a,b)=>a===b?'selected':'';return `<h1 class="title">Artículos</h1><p class="muted">Catálogo disponible para recogida en tienda</p><div class="filters panel"><input class="field" maxlength="100" placeholder="Buscar por nombre" value="${esc(f.q)}" oninput="state.filters.q=this.value;updateProducts()"><select class="field" onchange="state.filters.cat=this.value;updateProducts()"><option value="">Todas las categorías</option>${state.categories.filter(c=>c.Activo).map(c=>`<option value="${c.CategoriaId}" ${sel(f.cat,String(c.CategoriaId))}>${esc(c.Nombre)}</option>`).join('')}</select><select class="field" onchange="state.filters.stock=this.value;updateProducts()"><option value="">Toda disponibilidad</option>${['Agotado','Baja','Media','Alta'].map((l,i)=>`<option value="${i}" ${sel(f.stock,String(i))}>${l}</option>`).join('')}</select><select class="field" onchange="state.filters.order=this.value;updateProducts()"><option value="az" ${sel(f.order,'az')}>Nombre A–Z</option><option value="price" ${sel(f.order,'price')}>Menor precio</option></select></div>${legend()}<div id="articleResults"><p class="muted">${filtered().length} artículos · Precios en RD$</p><div class="products">${filtered().map(productCard).join('')||'<p>No encontramos artículos.</p>'}</div></div>`}
function productDetail(){const p=getProduct(state.selectedProduct);if(!p||!p.activo||!p.categoriaActiva)return '<p>Producto no disponible.</p><button class="btn secondary" onclick="go(\'articulos\')">Volver</button>';return `<button class="back" onclick="go('articulos')">← Volver al catálogo</button><div class="detail-layout">${productImage(p,'detail-image')}<section class="panel detail-info"><div class="muted">Inicio › Artículos › ${esc(p.categoria)}</div><h1 class="title">${esc(p.nombre)}</h1><div class="price">${money(p.precio)}</div>${availability(p)}<p>${esc(p.descripcion||'Producto para recogida en tienda.')}</p><button class="btn primary" style="width:100%" ${p.stock?'':'disabled'} onclick="add(${p.articuloId})">Agregar al carrito</button></section></div>`}
function clearRequest(){state.requestId=null;if(state.user)localStorage.removeItem('supermarknet_request_'+state.user.usuarioId)}
function changeCart(id,delta){const p=getProduct(id),n=(state.cart.get(id)||0)+delta;if(n<=0)state.cart.delete(id);else{if(!p||!p.activo||!p.categoriaActiva||n>Math.min(99,p.stock)){toast('Cantidad no disponible.','error');return false}if(!state.cart.has(id)&&state.cart.size>=100){toast('Máximo 100 productos distintos.','error');return false}state.cart.set(id,n)}clearRequest();saveCart();updateHeader();return true}
function add(id){if(changeCart(id,1))toast(getProduct(id).nombre+' agregado','success')}
function qty(id,d){changeCart(id,d);render()}
function removeItem(id){state.cart.delete(id);clearRequest();saveCart();render()}
function totals(){let u=0,t=0;for(const [id,n] of state.cart){u+=n;t+=(getProduct(id)?.precio||0)*n}return {u,t}}
function cartValid(){return state.cart.size>0&&[...state.cart].every(([id,n])=>{const p=getProduct(id);return p?.activo&&p.categoriaActiva&&p.stock>=n&&n>=1&&n<=99})}
function cart(){const {u,t}=totals();if(!u)return `<h1 class="title">Mi carrito</h1><div class="panel empty"><h2>Tu carrito está vacío</h2><button class="btn primary" onclick="go('articulos')">Explorar artículos</button></div>`;return `<h1 class="title">Mi carrito</h1><p class="muted">${state.cart.size} productos · ${u} unidades para recogida</p><div class="cart-layout"><section class="panel cart-table">${[...state.cart].map(([id,n])=>{const p=getProduct(id);return `<div class="cart-item"><div class="row">${p?productImage(p,'thumb'):''}<div><b>${esc(p?.nombre||'Artículo no disponible')}</b>${!p||p.stock<n||!p.activo||!p.categoriaActiva?'<div class="stock-low">Revisa la cantidad</div>':''}</div></div><span class="unit">${money(p?.precio)}</span><span><button onclick="qty(${id},-1)">−</button> ${n} <button onclick="qty(${id},1)">+</button></span><b>${money(n*(p?.precio||0))}</b><button aria-label="Eliminar" onclick="removeItem(${id})">🗑</button></div>`}).join('')}</section><aside class="panel summary"><h2>Resumen de compra</h2><div class="summary-line total"><span>Total</span><span>${money(t)}</span></div><button class="btn primary" ${cartValid()?'':'disabled'} onclick="go('confirmar')">Proceder a recogida</button></aside></div>`}
const localDate=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santo_Domingo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
function checkout(){if(!cartValid())return cart();const {u,t}=totals(),min=localDate(new Date()),max=localDate(new Date(Date.now()+29*86400000));return `<h1 class="title">Confirmar recogida en tienda</h1><p class="muted">Verifica los datos y selecciona la hora de retiro.</p><form class="checkout" onsubmit="createOrder(event)"><div><section class="panel" style="padding:20px"><h2>Detalles de retiro</h2><div class="form-grid"><div class="full"><label>Cliente</label><input class="field" value="${esc(state.user.nombre)}" readonly></div><div class="full"><label>Teléfono de contacto</label>${phoneField('pickupPhone',state.user.telefono)}</div><div class="full"><label>Sucursal</label><input class="field" value="SuperMarkNet · Santo Domingo" readonly></div><div><label>Fecha de recogida</label><input class="field" type="date" id="pickupDate" min="${min}" max="${max}" value="${localDate(new Date(Date.now()+86400000))}" required></div><div><label>Hora</label><select class="field" id="pickupTime">${['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(h=>`<option>${h}</option>`).join('')}</select></div></div></section><section class="panel" style="padding:20px;margin-top:16px"><h2>Método de pago</h2>${['Efectivo en Tienda','Tarjeta de Credito','Tarjeta de Debito'].map((m,i)=>`<label><input type="radio" name="pay" value="${m}" ${i===0?'checked':''} onchange="paymentChoice()"> ${['Efectivo al retirar','Tarjeta de crédito','Tarjeta de débito'][i]}</label>`).join('')}<div id="cardForm" class="pay-box" hidden><b>Formulario seguro de tarjeta</b><p class="small muted">Al continuar, Stripe abrirá el formulario de número de tarjeta, titular, vencimiento y código de seguridad. Puedes seleccionar una tarjeta guardada o autorizar guardar una nueva.</p>${state.cards.length?`<p>Tarjetas registradas: ${state.cards.map(c=>esc(c.Marca)+' •••• '+esc(c.Ultimos4)).join(', ')}</p>`:''}<p class="small">No almacenamos el número completo ni el CVV. Modo de prueba: utiliza únicamente tarjetas de prueba. El pedido queda pendiente hasta la confirmación del proveedor.</p></div></section></div><aside class="panel summary"><h2>Resumen</h2><div class="summary-line"><span>Total unidades</span><span>${u}</span></div><div class="summary-line total"><span>Total a pagar</span><span>${money(t)}</span></div><label><input type="checkbox" required> Confirmo los datos de recogida</label><button class="btn primary" type="submit" id="orderSubmit">Generar pedido</button><button type="button" class="btn secondary" style="width:100%;margin-top:10px" onclick="go('carrito')">Volver</button></aside></form>`}
function paymentChoice(){const card=$('input[name=pay]:checked').value!=='Efectivo en Tienda';$('#cardForm').hidden=!card;$('#orderSubmit').textContent=card?'Continuar al formulario de tarjeta':'Generar pedido'}
async function createOrder(e){e.preventDefault();await busy(e.target,async()=>{if(!cartValid())throw Error('Revisa el stock antes de continuar.');const metodo=$('input[name=pay]:checked').value,fecha=$('#pickupDate').value+'T'+$('#pickupTime').value+':00-04:00';if(new Date(fecha)<=new Date())throw Error('Selecciona una fecha y hora futuras.');if(metodo!=='Efectivo en Tienda'){const check=await db.functions.invoke('crear-pago',{body:{comprobar:true}});if(check.error||!check.data?.listo)throw Error('La pasarela de tarjeta no está configurada. Puedes pagar en tienda.')}if(!state.requestId){state.requestId=crypto.randomUUID();localStorage.setItem('supermarknet_request_'+state.user.usuarioId,state.requestId)}const o=await rpc('sm_crear_pedido',{p_items:[...state.cart].map(([id,cantidad])=>({id,cantidad})),p_fecha:fecha,p_metodo:metodo,p_telefono:$('#pickupPhone').value,p_solicitud:state.requestId});state.lastOrder=o.pedidoId;state.lastReceipt=o;state.selectedOrder=o.pedidoId;state.cart.clear();saveCart();clearRequest();await refreshData();go('pedidos');if(metodo!=='Efectivo en Tienda')await payOrder(o.pedidoId);else{go('confirmacion');toast('Pedido registrado.','success')}})}
async function payOrder(id){try{const {data,error}=await db.functions.invoke('crear-pago',{body:{pedidoId:id}});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch{}throw Error(m)}if(!data?.url)throw Error('No se recibió el formulario de pago.');const url=new URL(data.url);if(url.protocol!=='https:'||url.hostname!=='checkout.stripe.com')throw Error('URL de pago inválida.');location.assign(url.href)}catch(e){toast('Pago pendiente: '+e.message+' Puedes reintentar desde Mis pedidos.','error')}}
function orderBadge(o){return `<span class="badge ${['Listo para recoger','Recogido'].includes(o.estado)?'ok':''}">${esc(o.estado)}</span>`}
function orders(){const own=state.orders.filter(o=>o.clienteId===state.user.usuarioId),active=own.find(o=>o.pedidoId===state.selectedOrder)||own[0];return `<h1 class="title">Mis pedidos</h1><p class="muted">Seguimiento automático · sin recargar la página</p><section class="panel table-scroll"><table class="orders"><thead><tr><th>Pedido</th><th>Solicitud</th><th>Recogida</th><th>Total</th><th>Estado</th><th>Pago</th></tr></thead><tbody>${own.map(o=>`<tr><td><button class="back" onclick="selectOrder(${o.pedidoId})">PED-${String(o.pedidoId).padStart(6,'0')}</button></td><td>${dateFmt(o.fechaPedido)}</td><td>${dateFmt(o.fechaRecogidaProgramada)}</td><td>${money(o.total)}</td><td>${orderBadge(o)}</td><td>${esc(o.pago?.Estado||'Sin registro')}</td></tr>`).join('')||'<tr><td colspan="6">No tienes pedidos.</td></tr>'}</tbody></table></section>${active?orderDetail(active):''}`}
function selectOrder(id){state.selectedOrder=id;render()}
function orderDetail(o){const idx=statuses.indexOf(o.estado);return `<section class="panel" style="padding:20px;margin-top:20px"><div class="row between"><h2>Detalle · PED-${String(o.pedidoId).padStart(6,'0')}</h2>${orderBadge(o)}</div>${o.estado==='Cancelado'?'<div class="notice danger">Pedido cancelado.</div>':`<div class="progress">${statuses.map((s,i)=>`<div class="step ${i<=idx?'done':''}">${i+1}. ${s}</div>`).join('')}</div>`}<p>${o.estado==='Listo para recoger'?'¡Tu pedido está listo! Presenta tu código.':'Estado actual: '+esc(o.estado)}</p><p>Pago: ${esc(o.pago?.MetodoPago||'—')} · ${esc(o.pago?.Estado||'—')}</p>${o.estado==='Solicitado'&&o.pago?.Estado==='Pendiente'&&o.pago?.MetodoPago!=='Efectivo en Tienda'?`<button class="btn primary" onclick="payOrder(${o.pedidoId})">Completar pago con tarjeta</button>`:''}<div class="pickup-code">${esc(o.codigoRecogida)}</div><div class="total row between"><span>Total</span><span>${money(o.total)}</span></div></section>`}
function confirmation(){const o=state.orders.find(x=>x.pedidoId===state.lastOrder)||state.lastReceipt;if(!o)return orders();return `<section class="panel confirmation"><div style="font-size:55px;color:var(--ok)">✓</div><h1>¡Pedido de recogida registrado!</h1><p>Presenta tu código al retirar en sucursal.</p><h2>PED-${String(o.pedidoId).padStart(6,'0')}</h2><div class="pickup-code">${esc(o.codigoRecogida)}</div><div class="summary-line total"><span>Total</span><span>${money(o.total)}</span></div><button class="btn primary" onclick="go('pedidos')">Ver seguimiento</button> <button class="btn secondary" onclick="go('inicio')">Inicio</button></section>`}
function nextStates(o){if(['Cancelado','Recogido'].includes(o.estado))return [];const card=o.pago&&o.pago.MetodoPago!=='Efectivo en Tienda';if(card&&o.pago.Estado!=='Completado')return [];let a=[statuses[statuses.indexOf(o.estado)+1]].filter(Boolean);if(!card)a.push('Cancelado');return a}
function admin(){const inv=state.products;return `<h1 class="title">Gestión de tienda</h1><p class="muted">Control de pedidos e inventario · SuperMarkNet</p><div class="admin-grid"><div class="panel kpi">Artículos activos<strong>${publicProducts().length}</strong></div><div class="panel kpi">Pedidos<strong>${state.orders.length}</strong></div><div class="panel kpi">Disponibilidad baja<strong>${inv.filter(p=>stockLevel(p)<=1).length}</strong></div><div class="panel kpi">Ventas recogidas<strong>${money(state.orders.filter(o=>o.estado==='Recogido').reduce((a,o)=>a+o.total,0))}</strong></div></div><h2>Control de pedidos</h2><section class="panel table-scroll"><table class="orders"><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Estado</th><th>Actualizar</th></tr></thead><tbody>${state.orders.map(o=>`<tr><td>PED-${o.pedidoId}<br><small>${esc(o.codigoRecogida)}</small></td><td>${esc(o.clienteNombre)}</td><td>${money(o.total)}</td><td>${esc(o.pago?.Estado||'—')}</td><td>${orderBadge(o)}</td><td>${nextStates(o).length?`<select class="field" onchange="updateOrderStatus(${o.pedidoId},this.value,this)"><option value="">Seleccionar</option>${nextStates(o).map(s=>`<option>${s}</option>`).join('')}</select>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">No hay pedidos.</td></tr>'}</tbody></table></section>${adminOnly()?`<h2>Reposición de inventario</h2><p class="muted">Solo administradores. El cliente ve colores, no las existencias exactas.</p>${legend()}<input class="field" maxlength="100" placeholder="Buscar producto en inventario" oninput="filterInventory(this.value)"><section class="panel table-scroll" style="margin-top:12px"><table class="orders"><thead><tr><th>Artículo</th><th>Categoría</th><th>Stock</th><th>Capacidad</th><th>Disponibilidad</th><th>Reponer</th></tr></thead><tbody id="inventoryRows">${inventoryRows(inv)}</tbody></table></section>`:''}`}
function inventoryRows(items){return items.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${esc(p.categoria)}</td><td>${p.stock}</td><td>${p.capacidad}</td><td>${availability(p)}</td><td><form class="row" onsubmit="replenish(event,${p.articuloId})"><input class="field inventory-input" name="cantidad" type="number" min="1" max="10000" step="1" placeholder="Añadir" aria-label="Unidades a añadir" required><input class="field inventory-input" name="capacidad" type="number" min="1" max="100000" step="1" value="${p.capacidad}" aria-label="Capacidad de referencia" required><button class="btn primary" type="submit">Reponer</button></form></td></tr>`).join('')}
function filterInventory(q){$('#inventoryRows').innerHTML=inventoryRows(state.products.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase())))}
async function replenish(e,id){e.preventDefault();await busy(e.target,async()=>{const f=new FormData(e.target);await rpc('sm_reponer',{p_articulo:id,p_cantidad:Number(f.get('cantidad')),p_capacidad:Number(f.get('capacidad'))});toast('Inventario actualizado.','success');await refreshData();render()})}
async function updateOrderStatus(id,value,el){if(!value)return;el.disabled=true;try{await rpc('sm_estado',{p_id:id,p_estado:value});toast('Estado actualizado.','success');await refreshData()}catch(e){toast(e.message,'error')}finally{render()}}
function profile(){return `<h1 class="title">Mi perfil</h1><p class="muted">Administra tus datos y métodos de pago.</p><div class="profile"><section class="panel"><h2>Información personal</h2><form onsubmit="editProfile(event)"><label>Nombre</label><input class="field" id="profileName" value="${esc(state.user.nombre)}" minlength="2" maxlength="80" required><label>Correo verificado</label><input class="field" value="${esc(state.user.correo)}" readonly><label>Teléfono</label>${phoneField('profilePhone',state.user.telefono)}<label>Rol</label><input class="field" value="${esc(state.user.rol)}" readonly><button type="submit" class="btn primary" style="margin-top:15px">Guardar cambios</button></form></section><section class="panel"><h2>Cambiar contraseña</h2><form onsubmit="changePassword(event)"><label>Nueva contraseña</label><input id="newPassword" class="field" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><label>Confirmar</label><input id="confirmPassword" class="field" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><button class="btn primary" type="submit" style="margin-top:15px">Actualizar contraseña</button></form><h2>Tarjetas registradas</h2>${state.cards.map(c=>`<p>💳 ${esc(c.Marca)} •••• ${esc(c.Ultimos4)} · ${c.MesVencimiento}/${c.AnoVencimiento}</p>`).join('')||'<p class="muted">Todavía no hay tarjetas registradas.</p>'}<p class="small muted">Puedes guardar o eliminar tarjetas desde el formulario seguro del proveedor. Solo guardamos referencias enmascaradas.</p><button class="btn secondary" onclick="logout()">Cerrar sesión</button></section></div>`}
async function editProfile(e){e.preventDefault();await busy(e.target,async()=>{await rpc('sm_editar_perfil',{p_nombre:$('#profileName').value,p_telefono:$('#profilePhone').value});state.user=await rpc('sm_perfil');render();toast('Perfil actualizado.','success')})}
async function changePassword(e){e.preventDefault();await busy(e.target,async()=>{if($('#newPassword').value!==$('#confirmPassword').value)throw Error('Las contraseñas no coinciden.');await result(db.auth.updateUser({password:$('#newPassword').value}));e.target.reset();toast('Contraseña actualizada.','success')})}
function notifications(){return `<h1 class="title">Notificaciones</h1><p class="muted">Avisos persistentes de cambios en tus pedidos.</p><button class="btn secondary" onclick="markRead()">Marcar todas como leídas</button><section class="panel" style="margin-top:16px">${state.notifications.map(n=>`<div class="notification ${n.Leida?'':'unread'}"><b>${esc(n.Mensaje)}</b><p class="small muted">${dateFmt(n.Fecha)}</p><button class="back" onclick="state.selectedOrder=${n.PedidoId};go('pedidos')">Ver pedido</button></div>`).join('')||'<div class="empty">No tienes notificaciones.</div>'}</section>`}
async function markRead(){try{await rpc('sm_leer_notificaciones');await refreshData();render()}catch(e){toast(e.message,'error')}}
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.filters.q=e.target.value;go('articulos')}});
window.addEventListener('online',()=>refreshData());window.addEventListener('offline',()=>net(false,'Sin internet'));
(async()=>{render();if(!db){net(false,'No se cargó Supabase');return}let recoveryEvent=false;db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recoveryEvent=true;setTimeout(()=>go('reset'),0)}});try{const {session}=await result(db.auth.getSession());if(recoveryEvent||location.hash.includes('type=recovery')){go('reset');return}if(session)await startSession();else net(true,'Listo para iniciar sesión')}catch(e){net(false,'Revisa la configuración');toast(e.message,'error')}})();
</script></body></html>
