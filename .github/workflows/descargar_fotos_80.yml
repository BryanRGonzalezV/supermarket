iki/File:Trash_bags.jpg", "url": "https://upload.wikimedia.org/wikipedia/commons/9/9f/Trash_bags.jpg", "local": "imagenes/catalogo-revisado/bolsas-de-basura-10-unidades.webp", "nota": "Foto de referencia del tipo de producto; marca, peso o volumen no certificados.", "estado": "Fuente identificada; descarga y revisión visual final pendientes"}, {"Categoria": "Limpieza", "Producto": "Guantes de limpieza (par)", "ImagenUrl": "imagenes/catalogo/guantes-de-limpieza-par.webp", "archivo_commons": "Dusters and rubber gloves.jpg", "fuente": "https://commons.wikimedia.org/wiki/File:Dusters_and_rubber_gloves.jpg", "url": "https://upload.wikimedia.org/wikipedia/commons/4/42/Dusters_and_rubber_gloves.jpg", "local": "imagenes/catalogo-revisado/guantes-de-limpieza-par.webp", "nota": "Guantes junto a otros utensilios.", "estado": "Fuente identificada; descarga y revisión visual final pendientes"}, {"Categoria": "Limpieza", "Producto": "Jabón de manos 500 ml", "ImagenUrl": "imagenes/catalogo/jabon-de-manos-500-ml.webp", "archivo_commons": "Dial antimicrobial liquid soap.jpg", "fuente": "https://commons.wikimedia.org/wiki/File:Dial_antimicrobial_liquid_soap.jpg", "url": "https://upload.wikimedia.org/wikipedia/commons/7/7a/Dial_antimicrobial_liquid_soap.jpg", "local": "imagenes/catalogo-revisado/jabon-de-manos-500-ml.webp", "nota": "Foto de referencia del tipo de producto; marca, peso o volumen no certificados.", "estado": "Fuente identificada; descarga y revisión visual final pendientes"}]'
          import json, csv, io, pathlib, time, re, html, hashlib, sys
          from PIL import Image, ImageOps
          import requests
          from urllib.parse import quote
          root=pathlib.Path('resultado');root.mkdir(exist_ok=True)
          rows=json.loads(MANIFEST)
          s=requests.Session();s.headers['User-Agent']='SuperMarkNetCatalog/1.0 (student project; Wikimedia Commons photo reuse)'
          def get(url, **kw):
           for i in range(4):
            try:
             r=s.get(url,timeout=60,**kw);r.raise_for_status();return r
            except requests.RequestException:
             if i==3:raise
             time.sleep(2**i)
          def clean(v):return html.unescape(re.sub(r'<[^>]*>','',v or '')).strip()
          credits=[]; success=[]; errors=[]; hashes=set()
          for n,r in enumerate(rows,1):
           try:
            data=get('https://commons.wikimedia.org/w/api.php',params={'action':'query','titles':'File:'+r['archivo_commons'],'redirects':1,'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':800,'format':'json'}).json()
            p=next(iter(data['query']['pages'].values()));info=p['imageinfo'][0];meta=info['extmetadata']
            lic=clean(meta.get('LicenseShortName',{}).get('value'));licenseurl=clean(meta.get('LicenseUrl',{}).get('value'));author=clean(meta.get('Artist',{}).get('value')) or clean(meta.get('Credit',{}).get('value'))
            if not lic or not re.search(r'CC BY|CC0|Public domain|PDM',lic,re.I):raise ValueError('Licencia no aceptada automáticamente: '+lic)
            blob=get(info.get('thumburl') or info['url']).content
            with Image.open(io.BytesIO(blob)) as im:
             im=ImageOps.exif_transpose(im).convert('RGB'); im.thumbnail((800,800));im=ImageOps.pad(im,(800,800),color='white')
            h=hashlib.sha256(im.tobytes()).hexdigest()
            if h in hashes:raise ValueError('Fotografía repetida')
            dest=root/r['local'];dest.parent.mkdir(parents=True,exist_ok=True);im.save(dest,'WEBP',quality=88);hashes.add(h)
            credits.append([r['Producto'],r['local'],p['title'],author,lic,licenseurl,info['descriptionurl'],'Redimensionada y fondo blanco; misma licencia de origen',r['nota']]);success.append(r)
            print(f'{n}/{len(rows)} OK {r["Producto"]}',flush=True)
           except Exception as e:
            errors.append([r['Producto'],r['fuente'],str(e)]);print(f'{n}/{len(rows)} ERROR {r["Producto"]}: {e}',flush=True)
           time.sleep(0.8)
          with (root/'creditos.csv').open('w',encoding='utf-8-sig',newline='') as f:
           w=csv.writer(f);w.writerow(['Producto','Archivo','Título','Autor','Licencia','URL licencia','Fuente','Cambios','Nota']);w.writerows(credits)
          with (root/'pendientes.csv').open('w',encoding='utf-8-sig',newline='') as f:
           w=csv.writer(f);w.writerow(['Producto','Fuente','Error']);w.writerows(errors)
          def q(s):return "'"+s.replace("'","''")+"'"
          if success:
           sql='BEGIN;\nWITH fotos(categoria,nombre,url) AS (VALUES\n'+',\n'.join('('+','.join(q(r[k]) for k in ['Categoria','Producto','local'])+')' for r in success)+'\n)\nUPDATE public."Articulos" a SET "ImagenUrl"=f.url FROM fotos f, public."Categorias" c WHERE a."CategoriaId"=c."CategoriaId" AND c."Nombre"=f.categoria AND a."Nombre"=f.nombre RETURNING a."ArticuloId",a."Nombre",a."ImagenUrl";\nCOMMIT;\n'
           (root/'06_catalogo_descargado.sql').write_text(sql,encoding='utf-8')
          (root/'RESULTADO.txt').write_text(f'Descargadas {len(success)} de {len(rows)}. Pendientes {len(errors)}.\nSubir solo las fotos existentes; conservar creditos.csv publicado con las fotos. Ejecutar 06_catalogo_descargado.sql después de subirlas. Comprobar visualmente las referencias.',encoding='utf-8')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarkNet-fotos-descargadas
          path: resultado/
